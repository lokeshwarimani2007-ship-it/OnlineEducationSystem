{% extends "base.html" %}

{% block title %}Login - Online Examination System{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-muted);">Sign in to access your exams or admin center</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Log In
            </button>
        </form>

        <!-- 1-Click Demo Login Switcher -->
        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
            <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center; font-weight: 600;">
                Quick Demo Credentials (1-Click Fill)
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
                <button type="button" class="btn btn-secondary" onclick="fillLogin('head@oes.com', 'head123')" style="font-size: 0.75rem; padding: 0.4rem 0.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem;">
                    <span style="color: #f59e0b; font-weight: 700;"><i class="fa-solid fa-crown"></i> Head</span>
                    <span style="color: var(--text-muted); font-size: 0.7rem;">head123</span>
                </button>
                <button type="button" class="btn btn-secondary" onclick="fillLogin('admin@oes.com', 'admin123')" style="font-size: 0.75rem; padding: 0.4rem 0.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem;">
                    <span style="color: #6366f1; font-weight: 700;"><i class="fa-solid fa-shield-halved"></i> Admin</span>
                    <span style="color: var(--text-muted); font-size: 0.7rem;">admin123</span>
                </button>
                <button type="button" class="btn btn-secondary" onclick="fillLogin('student@oes.com', 'student123')" style="font-size: 0.75rem; padding: 0.4rem 0.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem;">
                    <span style="color: #10b981; font-weight: 700;"><i class="fa-solid fa-user-graduate"></i> Student</span>
                    <span style="color: var(--text-muted); font-size: 0.7rem;">student123</span>
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Register here</a>
        </div>
    </div>
</div>

<script>
function fillLogin(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
